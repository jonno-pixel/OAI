workflows:
  jjs-signed:
    name: JJS signed iPhone and iPad build
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: nl.jjs.vrij
    scripts:
      - name: Run Swift core tests
        script: bash scripts/test_core.sh
      - name: Apply Apple signing profiles
        script: xcode-project use-profiles --project JJS.xcodeproj --archive-method development
      - name: Archive and export signed IPA
        script: |
          export JJS_EXPORT_OPTIONS=/Users/builder/export_options.plist
          bash scripts/build_signed.sh
    artifacts:
      - build/export/*.ipa
      - build/JJS.xcarchive/dSYMs/**
